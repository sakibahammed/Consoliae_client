<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Where the systems run</title>
<link rel="stylesheet" href="_ds/industry-2b90913c-b17b-42d5-83f6-74b78f87d0bf/styles.css">
<script src="https://unpkg.com/d3@7.9.0/dist/d3.min.js" integrity="sha384-CjloA8y00+1SDAUkjs099PVfnY2KmDC2BZnws9kh8D/lX1s46w6EPhpXdqMfjK6i" crossorigin="anonymous"></script>
<script src="https://unpkg.com/topojson-client@3.1.0/dist/topojson-client.min.js" integrity="sha384-Ukv1p/xTma6P4/2bY5KzWBw+ydSpXmhCMtyciIQVDJ1RmOxtCYNMF1uXT9T63H67" crossorigin="anonymous"></script>
<style>
  :root{
    --ink:#F3F3F1;--ink2:#EBEBE8;--ink3:#E0E3E7;
    --steel:#41617F;--live:#1F7A55;
    --dim:#5B6367;--line:rgba(29,31,32,.16);--line2:rgba(29,31,32,.32);
    --paper:#1D1F20;
  }
  html,body{margin:0;background:var(--ink);color:var(--paper);font-family:"Barlow",system-ui,sans-serif;overflow:hidden}
  #wrap{position:relative;width:100%;height:100vh}
  svg{display:block;width:100%;height:100%}
  .land{fill:#DCE0E4;stroke:rgba(29,31,32,.13);stroke-width:.5}
  .client{fill:rgba(31,122,85,.22);stroke:var(--live);stroke-width:.9;transition:fill .15s}
  .client.on{fill:rgba(31,122,85,.46)}
  .halo{fill:var(--live);opacity:.2;filter:url(#glow)}
  .dot{fill:var(--live)}
  .ring{fill:none;stroke:var(--live);stroke-width:.9;transform-box:fill-box;transform-origin:center;animation:ping 4.2s cubic-bezier(.2,.7,.3,1) infinite}
  .frame{fill:none;stroke:var(--line2);stroke-width:1}
  .tie{stroke:var(--line2);stroke-width:.75;stroke-dasharray:3 3;fill:none}
  .cap{font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:14px;fill:var(--dim);letter-spacing:.04em}
  .lbl{font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:15px;fill:var(--paper)}
  .sub{font-size:11.5px;fill:var(--dim)}
  .num{font-size:11.5px;fill:var(--live);font-variant-numeric:tabular-nums}
  .lead{stroke:rgba(29,31,32,.4);stroke-width:.7;fill:none}
  #panel{position:absolute;left:0;right:0;bottom:0;height:142px;border-top:1px solid var(--line2);background:rgba(242,242,243,.96);padding:12px 16px;display:flex;gap:22px;align-items:flex-start;pointer-events:none;overflow:hidden}
  #panel .head{flex:0 0 168px;min-width:0}
  #panel h3{font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:21px;margin:0;line-height:1.1}
  #panel .meta{font-size:12px;color:var(--live);margin:2px 0 0;font-variant-numeric:tabular-nums}
  #panel .rows{display:flex;gap:20px;flex:1;min-width:0}
  #panel .sys{flex:1;min-width:0;border-left:1px solid var(--line);padding-left:14px}
  #panel .nm{font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:16px}
  #panel .wt{font-size:12px;line-height:1.4;color:#A9BEC9;margin:3px 0 6px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  #panel .st{font-size:10.5px;color:var(--dim);font-family:ui-monospace,Menlo,monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #panel .mt{font-size:12.5px;color:var(--live);font-variant-numeric:tabular-nums;margin-top:4px}
  #panel .idle{font-size:13px;line-height:1.5;color:var(--dim);margin:0;max-width:620px}
  #legend{position:absolute;left:2px;top:2px;display:flex;gap:20px;align-items:center;font-size:12px;color:var(--dim);flex-wrap:wrap}
  #legend i{width:9px;height:9px;background:rgba(31,122,85,.5);border:1px solid var(--live);display:inline-block;margin-right:7px;vertical-align:-1px}
  @media (max-width:700px){
    #panel{height:126px;padding:10px 12px;gap:12px;flex-direction:column}
    #panel .head{flex:none}
    #panel h3{font-size:19px}
    #panel .rows{gap:14px;overflow-x:auto}
    #panel .sys{min-width:170px}
    #panel .wt{-webkit-line-clamp:2}
    #legend span:last-child{display:none}
  }
  @media (prefers-reduced-motion:reduce){.ring{animation:none;opacity:.3}}
</style>
</head>
<body>
<div id="wrap">
  <div id="panel"></div>
  <div id="legend"><span><i></i>country with a system we built or operate</span><span id="count"></span></div>
</div>
<script>
const CLIENTS = {
  "United States of America": { short: "United States", lon: -98, lat: 39, eu: false, ox: -4, oy: 26, sys: [
    { name: "Foundry Inference", what: "GPU serving tier for medical imaging models — batching, warm pools, per-tenant spend caps.", stack: "Ray · vLLM · Terraform · AWS", metric: "−58% GPU cost per request" },
    { name: "Verity Contract Review", what: "Clause extraction with citation back to source text and a reviewer disagreement loop.", stack: "Python · Claude · Qdrant · FastAPI", metric: "96.2% clause recall" },
    { name: "Cadence Billing", what: "Event-sourced metering and invoicing, with a replay tool for disputed periods.", stack: "Go · Postgres · Kafka · Stripe", metric: "0 corrections in 14 months" }
  ] },
  "Bangladesh": { short: "Bangladesh", lon: 90.3, lat: 23.7, eu: false, ox: 10, oy: 26, sys: [
    { name: "Northline Field App", what: "Offline-first inspection app with conflict resolution and photographic evidence sync.", stack: "React Native · SQLite · Go · S3", metric: "2,400 field users at peak" },
    { name: "Atlas Data Platform", what: "Ingestion from 40 store systems into one warehouse, contract tested on every feed.", stack: "Python · dbt · Snowflake · Dagster", metric: "nightly load 4 h → 11 min" },
    { name: "Kiln Deploy Pipeline", what: "Replaced a 90-minute manual release with trunk-based delivery and progressive rollout.", stack: "GitHub Actions · Argo · Kubernetes", metric: "31 deploys/day, was 2/week" }
  ] },
  "United Kingdom": { short: "United Kingdom", lon: -1.8, lat: 52.6, eu: true, sys: [
    { name: "Ravel Support Copilot", what: "Retrieval over six years of tickets, with an eval suite gating every prompt change.", stack: "TypeScript · pgvector · Claude", metric: "61% first-touch resolution" },
    { name: "Solent Booking", what: "Rebuilt search and checkout, with inventory caching that survives supplier outages.", stack: "Next.js · Redis · Postgres", metric: "+22% checkout completion" }
  ] },
  "Norway": { short: "Norway", lon: 9.2, lat: 61.2, eu: true, sys: [
    { name: "Pellet Forecasting", what: "Training pipeline with drift alerts and a fallback to last-known-good model.", stack: "Python · Ray · MLflow · Airflow", metric: "−31% forecast error (MAPE)" }
  ] },
  "Sweden": { short: "Sweden", lon: 15.6, lat: 60.5, eu: true, sys: [
    { name: "Meridian KYC", what: "Document-reading agent with a human escalation queue and an audit trail per decision.", stack: "Python · Temporal · Claude", metric: "−74% manual review time" }
  ] },
  "Netherlands": { short: "Netherlands", lon: 5.4, lat: 52.2, eu: true, sys: [
    { name: "Halyard Routing", what: "Rewrote the routing service and moved solve jobs onto a queue with spot capacity.", stack: "Go · Kafka · Kubernetes · Redis", metric: "p99 340 ms, was 4.1 s" }
  ] },
  "Switzerland": { short: "Switzerland", lon: 8.2, lat: 46.8, eu: true, sys: [
    { name: "Consoliae Status", what: "The dashboard every client system reports into. Public, because it should be.", stack: "Grafana · Prometheus · Loki", metric: "99.98% rolling 12 months" }
  ] }
};
Object.values(CLIENTS).forEach(c => { c.n = c.sys.length; c.who = c.sys.map(s => s.name).join(', '); });
const total = Object.values(CLIENTS).reduce((a, c) => a + c.n, 0);
document.getElementById('count').textContent =
  total + ' systems · ' + Object.keys(CLIENTS).length + ' countries · data resident in-region';

const wrap = document.getElementById('wrap');
const mapFail = () => { wrap.innerHTML = '<p style="margin:0;padding:24px;font-size:14px;color:var(--dim)">The map could not load. The country list below has the same information.</p>'; };
if (!window.d3 || !window.topojson) { mapFail(); throw new Error('map libraries did not load'); }
const svg = d3.select('#wrap').append('svg').attr('aria-label',
  'World map. Countries running Consoliae systems: ' +
  Object.values(CLIENTS).map(c => c.short + ' (' + c.n + ')').join(', ') + '.');
const defs = svg.append('defs');
defs.append('filter').attr('id', 'glow')
  .attr('x', '-140%').attr('y', '-140%').attr('width', '380%').attr('height', '380%')
  .append('feGaussianBlur').attr('stdDeviation', 8);
defs.append('clipPath').attr('id', 'inset').append('rect');

const gLand = svg.append('g'), gGlow = svg.append('g'), gClient = svg.append('g'),
      gPts = svg.append('g'), gUS = svg.append('g'), gTie = svg.append('g'),
      gIn = svg.append('g').attr('clip-path', 'url(#inset)'), gInLbl = svg.append('g'),
      gFrame = svg.append('g');

d3.json('https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-110m.json').catch(() => { mapFail(); throw new Error('world atlas did not load'); }).then(topo => {
  const all = topojson.feature(topo, topo.objects.countries).features
    .filter(f => f.properties.name !== 'Antarctica');
  const fc = { type: 'FeatureCollection', features: all };
  const euFeats = all.filter(f => CLIENTS[f.properties.name] && CLIENTS[f.properties.name].eu);

  const draw = () => {
    const w = wrap.clientWidth, h = wrap.clientHeight;
    const wide = w > 700;
    const iw = Math.min(330, w * 0.34), ih = Math.min(h - 168, 330);
    const ix = w - iw - 4, iy = 8;
    const padR = wide ? iw + 26 : 8;
    const reserve = wide ? 156 : 138;
    svg.attr('viewBox', [0, 0, w, h]);

    const proj = d3.geoNaturalEarth1()
      .fitExtent([[8, 20], [Math.max(120, w - padR), Math.max(120, h - reserve)]], fc);
    const path = d3.geoPath(proj);

    gLand.selectAll('path').data(all).join('path').attr('class', 'land').attr('d', path);
    const cl = all.filter(f => CLIENTS[f.properties.name]);
    gGlow.selectAll('path').data(cl).join('path').attr('class', 'halo').attr('d', path);
    gClient.selectAll('path').data(cl).join('path').attr('class', 'client').attr('d', path)
      .on('mousemove', (ev, f) => hi(f.properties.name)).on('mouseleave', () => hi(null));

    const pts = Object.entries(CLIENTS).map(([name, d]) => ({ name, ...d, p: proj([d.lon, d.lat]) }));
    const g = gPts.selectAll('g').data(pts, d => d.name).join('g')
      .attr('transform', d => 'translate(' + d.p + ')')
      .on('mousemove', (ev, d) => hi(d.name)).on('mouseleave', () => hi(null));
    g.selectAll('circle.ring').data(d => d.n > 2 ? [d] : []).join('circle').attr('class', 'ring').attr('r', 3);
    g.selectAll('circle.dot').data(d => [d]).join('circle').attr('class', 'dot')
      .attr('r', d => 1.8 + Math.min(2.2, d.n * 0.7));

    // labels for countries outside the European cluster sit under their marker
    const ug = gUS.selectAll('g').data(pts.filter(d => !d.eu), d => d.name).join('g')
      .attr('transform', d => 'translate(' + (d.p[0] + d.ox) + ',' + (d.p[1] + d.oy) + ')');
    ug.selectAll('text.lbl').data(d => [d]).join('text').attr('class', 'lbl').text(d => d.short);
    ug.selectAll('text.num').data(d => [d]).join('text').attr('class', 'num').attr('dy', 15)
      .text(d => d.n + (d.n > 1 ? ' systems' : ' system'));

    if (!wide) { gIn.selectAll('*').remove(); gInLbl.selectAll('*').remove(); gFrame.selectAll('*').remove(); gTie.selectAll('*').remove(); return; }

    // ── Europe detail inset ──
    defs.select('#inset rect').attr('x', ix).attr('y', iy).attr('width', iw).attr('height', ih);
    const ip = d3.geoMercator().fitExtent([[ix + 14, iy + 34], [ix + iw * 0.52, iy + ih - 16]],
      { type: 'FeatureCollection', features: euFeats });
    const ipath = d3.geoPath(ip);

    gIn.selectAll('path.land').data(all).join('path').attr('class', 'land').attr('d', ipath);
    gIn.selectAll('path.halo').data(euFeats).join('path').attr('class', 'halo').attr('d', ipath);
    gIn.selectAll('path.client').data(euFeats).join('path').attr('class', 'client').attr('d', ipath)
      .on('mousemove', (ev, f) => hi(f.properties.name)).on('mouseleave', () => hi(null));

    // labels in a column on the inset's right, de-overlapped, with short leaders
    const lab = euFeats.map(f => {
      const d = CLIENTS[f.properties.name];
      return { name: f.properties.name, ...d, c: ip([d.lon, d.lat]) };
    }).sort((a, b) => a.c[1] - b.c[1]);
    const lx = ix + iw * 0.58, step = Math.min(34, (ih - 56) / lab.length);
    let y = iy + 42;
    lab.forEach(d => { d.ly = Math.max(y, d.c[1]); y = d.ly + step; });
    const over = y - (iy + ih - 8);
    if (over > 0) lab.forEach(d => { d.ly -= over; });

    gInLbl.selectAll('path').data(lab, d => d.name).join('path').attr('class', 'lead')
      .attr('d', d => 'M' + d.c[0] + ',' + d.c[1] + ' L' + (lx - 12) + ',' + d.ly + ' L' + (lx - 4) + ',' + d.ly);
    const lg = gInLbl.selectAll('g').data(lab, d => d.name).join('g')
      .attr('transform', d => 'translate(' + lx + ',' + d.ly + ')')
      .on('mousemove', (ev, d) => hi(d.name)).on('mouseleave', () => hi(null));
    lg.selectAll('text.lbl').data(d => [d]).join('text').attr('class', 'lbl').attr('dy', 1).text(d => d.short);
    lg.selectAll('text.num').data(d => [d]).join('text').attr('class', 'num').attr('dy', 15)
      .text(d => d.n + (d.n > 1 ? ' systems' : ' system'));

    gFrame.selectAll('rect').data([0]).join('rect').attr('class', 'frame')
      .attr('x', ix).attr('y', iy).attr('width', iw).attr('height', ih);
    gFrame.selectAll('text').data([0]).join('text').attr('class', 'cap')
      .attr('x', ix + 12).attr('y', iy + 22).text('Europe — detail');

    // tie the inset back to the region it magnifies
    const b = d3.geoPath(proj).bounds({ type: 'FeatureCollection', features: euFeats });
    const bx = b[0][0] - 6, by = b[0][1] - 6, bw = b[1][0] - b[0][0] + 12, bh = b[1][1] - b[0][1] + 12;
    gTie.selectAll('rect').data([0]).join('rect').attr('class', 'tie')
      .attr('x', bx).attr('y', by).attr('width', bw).attr('height', bh);
    gTie.selectAll('path').data([0]).join('path').attr('class', 'tie')
      .attr('d', 'M' + (bx + bw) + ',' + by + ' L' + ix + ',' + iy +
                 ' M' + (bx + bw) + ',' + (by + bh) + ' L' + ix + ',' + (iy + ih));
  };
  draw();
  addEventListener('resize', draw);
});

const panel = document.getElementById('panel');
const IDLE = '<div class="head"><h3>Where the systems run</h3><p class="meta">' + total + ' systems · ' + Object.keys(CLIENTS).length + ' countries</p></div><div class="rows"><p class="idle">Hover a lit country to see the systems we built and deployed there — what each one does, what it runs on, and the number that mattered.</p></div>';
panel.innerHTML = IDLE;

function hi(name) {
  d3.selectAll('.client').classed('on', f => !!name && f.properties.name === name);
  const d = name && CLIENTS[name];
  if (!d) return;
  panel.innerHTML = '<div class="head"><h3>' + d.short + '</h3><p class="meta">' + d.n +
    (d.n > 1 ? ' systems built and deployed' : ' system built and deployed') + '</p></div><div class="rows">' +
    d.sys.map(s => '<div class="sys"><div class="nm">' + s.name + '</div><p class="wt">' + s.what +
      '</p><div class="st">' + s.stack + '</div><div class="mt">' + s.metric + '</div></div>').join('') + '</div>';
}
</script>
</body>
</html>
